        - generic [ref=f35e69]:
          - generic [ref=f35e71]:
            - generic [ref=f35e72]:
              - paragraph [ref=f35e73]: Full Stack Developer (AI & Automation) |
              - paragraph [ref=f35e74]: We Are Revolution
              - paragraph [ref=f35e75]: "📍 Location: Remote (India or Pakistan)"
              - paragraph [ref=f35e76]: "💼 Experience: 3-5 years"
              - paragraph [ref=f35e77]: "🎓 Education: Strong CS / Engineering background preferred"
              - paragraph [ref=f35e78]: 💰 $2000 a month - we pay for capability, not just years on paper
              - paragraph [ref=f35e79]
              - paragraph [ref=f35e80]: THE OPPORTUNITY
              - paragraph [ref=f35e81]: We Are Revolution is a specialist search and selection recruitment firm serving clients across the USA and Europe, built on data-backed, systematic processes.
              - paragraph [ref=f35e82]
              - paragraph [ref=f35e83]: "You'll work directly with our Head of Engineering to own the full stack and technical architecture of our internal systems end-to-end. This is a broad, high-trust role: we'd rather pay more for someone who's genuinely strong across the stack than go cheap and end up boxed in by narrow skills. You should be equally comfortable building frontend interfaces, writing backend code, designing automations, and orchestrating AI agents - because you may be the only technical person in the building on any given day, and things need to keep running. This is a full stack + automation heavy role (roughly 90% hands-on build, 10% coordinating priorities) for someone who takes ownership, figures things out independently, and uses AI as a core part of how they plan and execute work."
              - paragraph [ref=f35e84]
              - paragraph [ref=f35e85]: WHAT YOU'LL DO
              - paragraph [ref=f35e86]: + Build and maintain full stack applications and integrations - design and ship intuitive frontend interfaces alongside APIs and services connecting our internal tools, CRM, and outreach/calling platforms
              - paragraph [ref=f35e87]: + Consolidate and structure recruitment data - bring together candidate, client, and activity data into clean, reliable, single-source-of-truth systems
              - paragraph [ref=f35e88]: + Design and own automation workflows - build and maintain Python and n8n workflows that automate recruitment operations, data syncing, and reporting
              - paragraph [ref=f35e89]: + Build AI agents and MCP-based workflows - use Claude (and Claude Code) to design agentic workflows that automate research, data processing, and repetitive operational work
              - paragraph [ref=f35e90]: + Deploy, monitor, and optimize - own deployment and uptime for web applications and backend services; track API usage, costs, latency, and errors
              - paragraph [ref=f35e91]: + Be the technical backbone - hold institutional technical knowledge across the stack so the business isn't dependent on any single system or vendor
              - paragraph [ref=f35e92]
              - paragraph [ref=f35e93]: WHO WE'RE LOOKING FOR
              - paragraph [ref=f35e94]: + 3-5 years building and shipping production full stack applications (React/Next.js and Python FastAPI preferred); solid grasp of web UI, data structures, APIs, and clean architecture
              - paragraph [ref=f35e95]: + Hands-on experience with Backend-as-a-Service platforms - Supabase, Firebase, or similar
              - paragraph [ref=f35e96]: + Hands-on experience with API hosting/deployment platforms - Render, Railway, Heroku, or similar
              - paragraph [ref=f35e97]: + Proven, hands-on experience building workflows in n8n (or a comparable automation tool)
              - paragraph [ref=f35e98]: + Proficiency using Claude (or Claude Code) for planning and execution - you prompt effectively and evaluate AI-generated output critically
              - paragraph [ref=f35e99]: "+ Good to have: Salesforce experience - a strong plus, but not required; you'll be expected to pick it up quickly if you haven't used it"
              - paragraph [ref=f35e100]: "+ Good to have: Understanding of the recruitment space - a strong plus, but not required; you'll be expected to pick it up quickly if you haven't used it"
              - paragraph [ref=f35e101]
              - paragraph [ref=f35e102]: CULTURE FIT (NON-NEGOTIABLES)
              - paragraph [ref=f35e103]: + Broad and self-sufficient - you can move seamlessly across frontend, backend, automation, and AI tooling without waiting on someone else
              - paragraph [ref=f35e104]: + Builder mindset - you figure things out independently
              - paragraph [ref=f35e105]: + Fast learner - comfortable with ambiguity, ships iteratively
              - paragraph [ref=f35e106]: + Detail-oriented - cares about data quality, edge cases, and clean implementations
              - paragraph [ref=f35e107]: + Trusted to hold the fort - reliable enough to keep critical systems running through transitions
              - paragraph [ref=f35e108]: + Proactive communicator - flags blockers early, keeps the team updated
              - paragraph [ref=f35e109]
              - paragraph [ref=f35e110]: WHY JOIN US
              - paragraph [ref=f35e111]: ✅ Real ownership on a small, close-knit team
              - paragraph [ref=f35e112]: ✅ Broad technical exposure - frontend, backend, automation, AI agents, and Salesforce
              - paragraph [ref=f35e113]: ✅ International exposure - clients across the USA and Europe, async global team
              - paragraph [ref=f35e114]: ✅ Learn directly from a founder with two decades in recruitment and business-building
              - paragraph [ref=f35e115]: ✅ Competitive pay for the right person - we'd rather invest in one strong, well-rounded technologist than several narrow specialists
              - paragraph [ref=f35e116]
              - paragraph [ref=f35e117]: HOW TO APPLY
              - paragraph [ref=f35e118]: If you're a builder with 3-5 years of full stack experience, real hands-on automation and AI-tooling chops, and the ability to figure things out independently - we'd love to talk. Please apply above using your resume/GitHub/portfolio along with a brief note on what excites you about this role.
