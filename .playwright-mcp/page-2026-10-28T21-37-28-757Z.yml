              - paragraph [ref=e70]: 📍 Remote | 💼 2–4 years | 💰 Market-competitive, USD-pegged
              - paragraph [ref=e71]
              - paragraph [ref=e72]:
                - strong [ref=e73]: If Claude Code or Codex is already open on your screen, keep reading.
              - paragraph [ref=e74]
              - paragraph [ref=e75]:
                - strong [ref=e76]: 🚀 Why Dataspecc
              - paragraph [ref=e77]: Since 2019 we've delivered 100+ projects. We run full engineering teams for US-based SaaS products and build AI-powered platforms end to end. Everything our engineers write goes to production, in front of real customers. No demos, no throwaway prototypes.
              - paragraph [ref=e78]
              - paragraph [ref=e79]:
                - strong [ref=e80]: 🧠 The Role
              - paragraph [ref=e81]: We're hiring full stack engineers who have rebuilt how they work around AI coding agents. You'll plan, write, test, refactor and debug with Claude Code and Codex every day, and ship in days what used to take weeks.
              - paragraph [ref=e82]
              - paragraph [ref=e83]: To be clear, asking ChatGPT for the occasional snippet isn't what we mean. We want engineers who can run agents across a real codebase, read the output with a critical eye, and own what gets merged. Fast matters here. So does right.
              - paragraph [ref=e84]
              - paragraph [ref=e85]:
                - strong [ref=e86]: 🛠️ What You'll Do
              - list [ref=e87]:
                - listitem [ref=e88]: Ship full stack features end to end in TypeScript, from UI to API to database
                - listitem [ref=e89]: Use Claude Code and Codex as your primary tools for building, refactoring, testing and debugging
                - listitem [ref=e90]: Break big tasks into well-scoped agent work, then review, correct and merge the output
                - listitem [ref=e91]: "Integrate third-party APIs and services: payments, auth, CRMs, webhooks"
                - listitem [ref=e92]: Keep code clean, tested and maintainable while moving fast
                - listitem [ref=e93]: Work directly with client teams, take ownership and communicate clearly in English
              - paragraph [ref=e94]
